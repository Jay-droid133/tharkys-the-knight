// Is char (col, row) empty in mask?
function maskEmpty(maskId, col, row) {
    const val = maskData[maskId][row];
    return (val >>> (31 - col)) & 1;
}

// Build full 512x352 grid: 1=empty/passable, 0=wall
function buildGrid() {
    const grid = new Uint8Array(GRID_W * GRID_H);
    for (let ry = 0; ry < ROOMS_Y; ry++) {
        for (let rx = 0; rx < ROOMS_X; rx++) {
            const mid = roomGrid[ry][rx];
            const bx = rx * CHARS_X, by = ry * CHARS_Y;
            for (let r = 0; r < CHARS_Y; r++) {
                const val = maskData[mid][r];
                for (let c = 0; c < CHARS_X; c++) {
                    if ((val >>> (31 - c)) & 1) {
                        grid[(by + r) * GRID_W + (bx + c)] = 1;
                    }
                }
            }
        }
    }
    // Stitch room borders: if either side of a border has an empty char,
    // open both border chars to allow crossing
    // Horizontal borders (between room col 31 and col 0 of next)
    for (let ry = 0; ry < ROOMS_Y; ry++) {
        for (let rx = 0; rx < ROOMS_X - 1; rx++) {
            const bx = (rx + 1) * CHARS_X; // global col of right room's col 0
            const by = ry * CHARS_Y;
            for (let r = 0; r < CHARS_Y; r++) {
                const g1 = (by + r) * GRID_W + (bx - 1); // left room last col
                const g2 = (by + r) * GRID_W + bx;       // right room first col
                if (grid[g1] || grid[g2]) {
                    grid[g1] = 1;
                    grid[g2] = 1;
                }
            }
        }
    }
    // Vertical borders (between room row 21 and row 0 of next)
    for (let ry = 0; ry < ROOMS_Y - 1; ry++) {
        for (let rx = 0; rx < ROOMS_X; rx++) {
            const bx = rx * CHARS_X;
            const by = (ry + 1) * CHARS_Y; // global row of bottom room's row 0
            for (let c = 0; c < CHARS_X; c++) {
                const g1 = (by - 1) * GRID_W + (bx + c); // top room last row
                const g2 = by * GRID_W + (bx + c);       // bottom room first row
                if (grid[g1] || grid[g2]) {
                    grid[g1] = 1;
                    grid[g2] = 1;
                }
            }
        }
    }

    return grid;
}

// BFS on 512x352 char grid
function bfs(start, end) {
    const grid = buildGrid();
    const sx = start.gx, sy = start.gy;
    const ex = end.gx, ey = end.gy;

    if (sx === ex && sy === ey) return [{gx: sx, gy: sy}];
    if (!grid[sy * GRID_W + sx] || !grid[ey * GRID_W + ex]) return [];

    const visited = new Uint8Array(GRID_W * GRID_H);
    const prev = new Int32Array(GRID_W * GRID_H).fill(-1);
    const queue = [sy * GRID_W + sx];
    visited[queue[0]] = 1;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    while (queue.length > 0) {
        const k = queue.shift();
        const cx = k % GRID_W, cy = (k / GRID_W) | 0;
        for (const [dx, dy] of dirs) {
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
            const nk = ny * GRID_W + nx;
            if (visited[nk] || !grid[nk]) continue;
            visited[nk] = 1;
            prev[nk] = k;
            if (nx === ex && ny === ey) {
                const result = [{gx: nx, gy: ny}];
                let c = k;
                while (c >= 0) {
                    result.push({gx: c % GRID_W, gy: (c / GRID_W) | 0});
                    c = prev[c];
                }
                return result.reverse();
            }
            queue.push(nk);
        }
    }
    return [];
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function drawAll() {
    resizeCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);

    // Draw map image
    if (showGfx) ctx.drawImage(img, 0, 0);

    const cellW = MAP_W / ROOMS_X;  // 256
    const cellH = MAP_H / ROOMS_Y;  // 176

    // 8x8 pixel grid (only when zoomed enough)
    if (zoom > 0.5) {
        ctx.strokeStyle = 'rgba(80, 140, 255, 0.15)';
        ctx.lineWidth = 1 / zoom;
        for (let x = 0; x <= MAP_W; x += 8) {
            ctx.beginPath(); ctx.moveTo(x+0.5, 0); ctx.lineTo(x+0.5, MAP_H); ctx.stroke();
        }
        for (let y = 0; y <= MAP_H; y += 8) {
            ctx.beginPath(); ctx.moveTo(0, y+0.5); ctx.lineTo(MAP_W, y+0.5); ctx.stroke();
        }
    }

    // Draw mask overlay per room
    const wallColor = showGfx ? 'rgba(120, 120, 120, 0.4)' : 'rgba(80, 80, 80, 1)';
    const passColor = showGfx ? null : 'rgba(30, 30, 50, 1)';
    for (let ry = 0; ry < ROOMS_Y; ry++) {
        for (let rx = 0; rx < ROOMS_X; rx++) {
            const mid = roomGrid[ry][rx];
            const bx = rx * cellW, by = ry * cellH;
            for (let r = 0; r < CHARS_Y; r++) {
                const val = maskData[mid][r];
                for (let c = 0; c < CHARS_X; c++) {
                    const empty = (val >>> (31 - c)) & 1;
                    if (!empty) {
                        ctx.fillStyle = wallColor;
                        ctx.fillRect(bx + c * 8, by + r * 8, 8, 8);
                    } else if (passColor) {
                        ctx.fillStyle = passColor;
                        ctx.fillRect(bx + c * 8, by + r * 8, 8, 8);
                    }
                }
            }
        }
    }

    // Template tint overlay per room
    if (showTints || selectedTemplate >= 0) {
    for (let ry = 0; ry < ROOMS_Y; ry++) {
        for (let rx = 0; rx < ROOMS_X; rx++) {
            const mid = roomGrid[ry][rx];
            const bx = rx * cellW, by = ry * cellH;
            if (selectedTemplate >= 0 && mid === selectedTemplate) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.25)';
                ctx.fillRect(bx, by, cellW, cellH);
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
                ctx.lineWidth = 3 / zoom;
                ctx.strokeRect(bx + 1, by + 1, cellW - 2, cellH - 2);
            } else if (showTints) {
                ctx.fillStyle = templateColors[mid];
                ctx.fillRect(bx, by, cellW, cellH);
            }
        }
    }
    }

    // Room grid lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 1 / zoom;
    for (let i = 0; i <= ROOMS_X; i++) {
        const x = i * cellW + 0.5;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke();
    }
    for (let i = 0; i <= ROOMS_Y; i++) {
        const y = i * cellH + 0.5;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke();
    }

    // Room coordinates
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let y = 0; y < ROOMS_Y; y++) {
        for (let x = 0; x < ROOMS_X; x++) {
            ctx.fillText(`${x},${y}`, x * cellW + 3, y * cellH + 12);
        }
    }

    // Draw path line (on top of everything)
    if (path.length > 1) {
        ctx.strokeStyle = 'rgba(255, 220, 0, 0.9)';
        ctx.lineWidth = 3 / zoom;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(path[0].gx * 8 + 4, path[0].gy * 8 + 4);
        let pdx = 0, pdy = 0;
        for (let i = 1; i < path.length; i++) {
            const dx = path[i].gx - path[i-1].gx;
            const dy = path[i].gy - path[i-1].gy;
            if (dx !== pdx || dy !== pdy || i === path.length - 1) {
                const p = (i === path.length - 1) ? path[i] : path[i-1];
                ctx.lineTo(p.gx * 8 + 4, p.gy * 8 + 4);
                pdx = dx; pdy = dy;
            }
        }
        const last = path[path.length - 1];
        ctx.lineTo(last.gx * 8 + 4, last.gy * 8 + 4);
        ctx.stroke();
    }

    // Origin/dest markers
    if (origin) {
        ctx.fillStyle = 'rgba(0, 220, 60, 0.5)';
        ctx.beginPath();
        ctx.arc(origin.gx * 8 + 4, origin.gy * 8 + 4, 16, 0, Math.PI*2);
        ctx.fill();
    }
    if (dest) {
        ctx.fillStyle = 'rgba(220, 40, 40, 0.5)';
        ctx.beginPath();
        ctx.arc(dest.gx * 8 + 4, dest.gy * 8 + 4, 16, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
    updateInfo();
}

function updateInfo() {
    let txt = `${ROOMS_X}x${ROOMS_Y} rooms | Zoom: ${(zoom*100).toFixed(0)}%\n`;
    if (state === 'pick_origin') txt += 'Click a cell to set ORIGIN';
    else if (state === 'pick_dest') {
        const rx = (origin.gx / CHARS_X) | 0, ry = (origin.gy / CHARS_Y) | 0;
        txt += `Origin: room ${rx},${ry} char ${origin.gx % CHARS_X},${origin.gy % CHARS_Y} | Click DEST`;
    } else if (state === 'showing') {
        const rx1 = (origin.gx / CHARS_X) | 0, ry1 = (origin.gy / CHARS_Y) | 0;
        const rx2 = (dest.gx / CHARS_X) | 0, ry2 = (dest.gy / CHARS_Y) | 0;
        txt += `Origin: ${rx1},${ry1} | Dest: ${rx2},${ry2}\n`;
        if (path.length > 0) txt += `Path: ${path.length} chars`;
        else txt += 'No path found!';
        txt += '\nClick to reset';
    }
    info.textContent = txt;
}

// Mouse → map coords
function mouseToMap(e) {
    const m = screenToMap(e.clientX, e.clientY);
    return m;
}

// Mousemove: show coords
canvas.addEventListener('mousemove', (e) => {
    if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        drawAll();
        return;
    }
    const m = mouseToMap(e);
    const rx = Math.floor(m.x / 256);
    const ry = Math.floor(m.y / 176);
    if (rx >= 0 && rx < ROOMS_X && ry >= 0 && ry < ROOMS_Y) {
        const charCol = Math.floor((m.x - rx * 256) / 8);
        const charRow = Math.floor((m.y - ry * 176) / 8);
        const mid = roomGrid[ry][rx];
        info.textContent = `Room: ${rx},${ry}  Char: ${charCol},${charRow}  Template: ${mid}  Zoom: ${(zoom*100).toFixed(0)}%`;
    }
});

// Click: pick origin/dest
canvas.addEventListener('click', (e) => {
    const m = mouseToMap(e);
    const gx = Math.floor(m.x / 8);
    const gy = Math.floor(m.y / 8);

    if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return;

    if (state === 'pick_origin') {
        origin = {gx, gy};
        dest = null;
        path = [];
        state = 'pick_dest';
    } else if (state === 'pick_dest') {
        dest = {gx, gy};
        path = bfs(origin, dest);
        state = 'showing';
    } else {
        origin = null;
        dest = null;
        path = [];
        state = 'pick_origin';
    }
    drawAll();
});

// Right-click: select/deselect template
canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const m = mouseToMap(e);
    const rx = Math.floor(m.x / 256);
    const ry = Math.floor(m.y / 176);
    if (rx >= 0 && rx < ROOMS_X && ry >= 0 && ry < ROOMS_Y) {
        const mid = roomGrid[ry][rx];
        selectedTemplate = (selectedTemplate === mid) ? -1 : mid;
        drawAll();
    }
});

// Wheel: zoom centered on cursor
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const m = mouseToMap(e);
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newZoom = Math.max(0.1, Math.min(10, zoom * factor));
    // Adjust pan so point under cursor stays fixed
    panX = e.clientX - m.x * newZoom;
    panY = e.clientY - m.y * newZoom;
    zoom = newZoom;
    drawAll();
}, { passive: false });

// Middle button: pan
canvas.addEventListener('mousedown', (e) => {
    if (e.button === 1) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        canvas.style.cursor = 'grabbing';
    }
});
canvas.addEventListener('mouseup', (e) => {
    if (e.button === 1) {
        isPanning = false;
        canvas.style.cursor = 'crosshair';
    }
});
canvas.addEventListener('mouseleave', () => {
    isPanning = false;
    canvas.style.cursor = 'crosshair';
});
// Prevent middle-click paste/scroll
canvas.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });

window.addEventListener('resize', drawAll);

img.onload = () => {
    // Fit map to window initially
    const scaleX = window.innerWidth / MAP_W;
    const scaleY = window.innerHeight / MAP_H;
    zoom = Math.min(scaleX, scaleY);
    panX = (window.innerWidth - MAP_W * zoom) / 2;
    panY = (window.innerHeight - MAP_H * zoom) / 2;
    drawAll();
};
</script>
</body>
</html>
