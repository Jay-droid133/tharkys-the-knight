<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HUD Viewer · Tharkys</title>
<style>
  :root {
    --bg: #1c1c1f;
    --panel: #26262b;
    --grid-line: rgba(255, 255, 255, 0.08);
    --grid-line-strong: rgba(255, 255, 255, 0.22);
    --accent: #6bd;
    --warn: #e66;
    --fixed: #555;
    --text: #ddd;
    --muted: #888;
    --char-px: 24px;      /* CSS pixels per Spectrum char (8 px × scale 3) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.3 system-ui, sans-serif; }
  header {
    background: var(--panel);
    padding: 8px 14px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #000;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header button {
    background: #353539; color: var(--text);
    border: 1px solid #444; border-radius: 4px;
    padding: 5px 11px; cursor: pointer; font: inherit;
  }
  header button:hover { background: #444; }
  #status {
    margin-left: auto;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 13px; color: var(--muted);
  }
  #status.warn { color: var(--warn); }
  main {
    display: flex; gap: 16px;
    padding: 16px;
    align-items: flex-start;
  }
  #canvas-wrap {
    position: relative;
    width: calc(32 * var(--char-px));
    height: calc(24 * var(--char-px));
    background: #000;
    border: 1px solid #444;
    flex: 0 0 auto;
  }
  #grid { position: absolute; inset: 0; pointer-events: none; }
  #elements { position: absolute; inset: 0; }
  .elem {
    position: absolute;
    box-sizing: border-box;
    cursor: grab;
    overflow: hidden;
    user-select: none;
    min-width: 16px;
    min-height: 16px;
  }
  .elem:hover { outline: 1px solid var(--accent); }
  .elem:active { cursor: grabbing; }
  .elem.fixed { cursor: not-allowed; opacity: 0.9; }
  .elem.fixed:hover { outline: 1px solid var(--fixed); }
  .elem.collision { outline: 2px solid var(--warn); box-shadow: 0 0 0 2px var(--warn) inset; }
  .elem .label { display: none; }
  .elem canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .elem.placeholder { background: #222; }
  .elem.text {
    background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Consolas, monospace; font-size: 14px;
    letter-spacing: 1px;
  }
  #sidebar {
    flex: 0 0 240px;
    background: var(--panel);
    border: 1px solid #444; border-radius: 4px;
    padding: 12px;
    min-height: calc(24 * var(--char-px));
  }
  #sidebar h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  #parked {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
  }
  #parked .elem {
    position: static;
    flex: 0 0 auto;
  }
  footer { padding: 0 16px 16px; color: var(--muted); font-size: 12px; }
  kbd { background: #333; padding: 1px 5px; border-radius: 3px; border: 1px solid #555; font-family: inherit; font-size: 11px; }
</style>
</head>

<script>
'use strict';

const CHAR_PX = 24;             // CSS px per Spectrum char
const COLS = 32, ROWS = 24;
const STORAGE_KEY = 'hud_viewer_v1';

const SPECTRUM_PALETTE = {
  normal: ['#000000', '#0000CD', '#CD0000', '#CD00CD', '#00CD00', '#00CDCD', '#CDCD00', '#CDCDCD'],
  bright: ['#000000', '#0000FF', '#FF0000', '#FF00FF', '#00FF00', '#00FFFF', '#FFFF00', '#FFFFFF'],
};

function attrColors(attr) {
  const ink = attr & 7;
  const paper = (attr >> 3) & 7;
  const palette = (attr & 0x40) ? SPECTRUM_PALETTE.bright : SPECTRUM_PALETTE.normal;
  return { ink: palette[ink], paper: palette[paper] };
}

function renderSpriteToCanvas(canvas, sprite, scale) {
  scale = scale || 1;
  const wb = sprite.w_chars, hb = sprite.h_chars;
  canvas.width  = wb * 8 * scale;
  canvas.height = hb * 8 * scale;
  const ctx = canvas.getContext('2d');
  for (let cy = 0; cy < hb; cy++) {
    for (let cx = 0; cx < wb; cx++) {
      const attr = sprite.attrBytes[cy * wb + cx];
      const { ink, paper } = attrColors(attr);
      for (let scan = 0; scan < 8; scan++) {
        const byte = sprite.pixelBytes[(cy * 8 + scan) * wb + cx];
        for (let bit = 0; bit < 8; bit++) {
          const on = (byte & (0x80 >> bit)) !== 0;
          ctx.fillStyle = on ? ink : paper;
          ctx.fillRect((cx * 8 + bit) * scale, (cy * 8 + scan) * scale, scale, scale);
        }
      }
    }
  }
}

let SPRITES = {};       // hud_elements_existing.json contents
let ELEMENTS = [];      // current layout, mutated by user

function load() {
  if (!window.HUD_ELEMENTS || !window.HUD_LAYOUT_INITIAL) {
    setStatus('Error: faltan hud_elements_existing.js / hud_layout_initial.js', true);
    return;
  }
  SPRITES = window.HUD_ELEMENTS;
  const initial = window.HUD_LAYOUT_INITIAL.elements.map(e => ({ ...e }));

  // Apply persisted overrides if present
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const savedArr = JSON.parse(saved);
      const savedMap = new Map(savedArr.map(s => [s.id, s]));
      for (const e of initial) {
        const s = savedMap.get(e.id);
        if (s) {
          if ('col' in s) e.col = s.col;
          if ('row' in s) e.row = s.row;
          if ('placed' in s) e.placed = s.placed;
        }
      }
    } catch (err) {
      console.warn('Bad localStorage payload, ignoring:', err);
    }
  }
  ELEMENTS = initial;
  renderAll();
  const placedN = ELEMENTS.filter(e => e.placed).length;
  const parkedN = ELEMENTS.length - placedN;
  setStatus(`Listo. ${placedN} colocados + ${parkedN} sin colocar.`, false);
}

function persist() {
  const minimal = ELEMENTS.map(e => ({ id: e.id, col: e.col, row: e.row, placed: e.placed }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(minimal));
}

function setStatus(msg, isWarn) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('warn', !!isWarn);
}

function computeCollisions() {
  // Set of ids that overlap any other placed element.
  const placed = ELEMENTS.filter(e => e.placed);
  const collisions = new Set();
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      if (a.col < b.col + b.w && a.col + a.w > b.col &&
          a.row < b.row + b.h && a.row + a.h > b.row) {
        collisions.add(a.id);
        collisions.add(b.id);
      }
    }
  }
  return collisions;
}

function renderAll() {
  drawGrid();
  renderElements();
}

function drawGrid() {
  const canvas = document.getElementById('grid');
  const w = COLS * CHAR_PX, h = ROWS * CHAR_PX;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c <= COLS; c++) {
    ctx.moveTo(c * CHAR_PX + 0.5, 0);
    ctx.lineTo(c * CHAR_PX + 0.5, h);
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.moveTo(0, r * CHAR_PX + 0.5);
    ctx.lineTo(w, r * CHAR_PX + 0.5);
  }
  ctx.stroke();

  // Strong lines every 8 chars (third boundaries)
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line-strong');
  ctx.beginPath();
  for (let c = 0; c <= COLS; c += 8) {
    ctx.moveTo(c * CHAR_PX + 0.5, 0);
    ctx.lineTo(c * CHAR_PX + 0.5, h);
  }
  for (let r = 0; r <= ROWS; r += 8) {
    ctx.moveTo(0, r * CHAR_PX + 0.5);
    ctx.lineTo(w, r * CHAR_PX + 0.5);
  }
  ctx.stroke();
}

function elementNode(e, collisions) {
  const node = document.createElement('div');
  node.className = 'elem ' + (e.kind || 'placeholder');
  if (e.fixed) node.classList.add('fixed');
  if (collisions && collisions.has(e.id)) node.classList.add('collision');
  node.dataset.id = e.id;
  node.style.width  = (e.w * CHAR_PX) + 'px';
  node.style.height = (e.h * CHAR_PX) + 'px';

  if (e.kind === 'sprite' && SPRITES[e.spriteRef]) {
    const cv = document.createElement('canvas');
    renderSpriteToCanvas(cv, SPRITES[e.spriteRef], 3);
    node.appendChild(cv);
  } else if (e.kind === 'sprite-row' && SPRITES[e.spriteRef]) {
    // Render `count` copies horizontally
    const cv = document.createElement('canvas');
    const sp = SPRITES[e.spriteRef];
    cv.width  = sp.w_chars * 8 * 3 * (e.count || 1);
    cv.height = sp.h_chars * 8 * 3;
    const ctx = cv.getContext('2d');
    const tmp = document.createElement('canvas');
    renderSpriteToCanvas(tmp, sp, 3);
    for (let i = 0; i < (e.count || 1); i++) {
      ctx.drawImage(tmp, i * tmp.width, 0);
    }
    node.appendChild(cv);
  } else if (e.kind === 'text') {
    node.classList.add('text');
    node.textContent = e.text || e.label;
  } else {
    node.classList.add('placeholder');
    if (e.color) node.style.background = e.color;
  }

  const lbl = document.createElement('span');
  lbl.className = 'label';
  lbl.textContent = e.label || e.id;
  node.appendChild(lbl);

  return node;
}

function renderElements() {
  const placedHost = document.getElementById('elements');
  const parkedHost = document.getElementById('parked');
  placedHost.innerHTML = '';
  parkedHost.innerHTML = '';
  const collisions = computeCollisions();
  for (const e of ELEMENTS) {
    const n = elementNode(e, collisions);
    if (e.placed) {
      n.style.left = (e.col * CHAR_PX) + 'px';
      n.style.top  = (e.row * CHAR_PX) + 'px';
      placedHost.appendChild(n);
    } else {
      parkedHost.appendChild(n);
    }
    if (!e.fixed) wireDrag(n, e);
  }
}

// ---- Drag mechanics --------------------------------------------------------

let drag = null;  // { element, ghost, offsetX, offsetY }

function wireDrag(node, e) {
  node.addEventListener('pointerdown', (ev) => {
    if (e.fixed) return;
    ev.preventDefault();
    node.setPointerCapture(ev.pointerId);
    const rect = node.getBoundingClientRect();
    const ghost = node.cloneNode(true);
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left + 'px';
    ghost.style.top  = rect.top + 'px';
    ghost.style.pointerEvents = 'none';
    ghost.style.opacity = '0.85';
    ghost.style.zIndex = '999';
    document.body.appendChild(ghost);
    drag = {
      element: e,
      ghost,
      pointerId: ev.pointerId,
      offsetX: ev.clientX - rect.left,
      offsetY: ev.clientY - rect.top,
      sourceNode: node,
    };
    node.style.opacity = '0.4';

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function onMove(ev) {
  if (!drag) return;
  drag.ghost.style.left = (ev.clientX - drag.offsetX) + 'px';
  drag.ghost.style.top  = (ev.clientY - drag.offsetY) + 'px';
  const drop = computeDropTarget(ev.clientX, ev.clientY);
  if (drop.kind === 'canvas') {
    setStatus(`Drop @ col ${drop.col}, row ${drop.row} · ${drag.element.w}×${drag.element.h}` +
              (drop.collides ? ` · COLISIÓN con: ${drop.collisionsWith.join(', ')}` : ''),
              drop.collides);
  } else if (drop.kind === 'sidebar') {
    setStatus(`Drop → barra lateral (sin colocar)`, false);
  } else {
    setStatus(`Fuera de cualquier zona de drop`, true);
  }
}

function computeDropTarget(clientX, clientY) {
  const canvasRect = document.getElementById('canvas-wrap').getBoundingClientRect();
  const sidebarRect = document.getElementById('sidebar').getBoundingClientRect();
  // Drop point = top-left of element after applying offset
  const tlx = clientX - drag.offsetX;
  const tly = clientY - drag.offsetY;
  // Use top-left + half-cell as anchor for snapping
  if (tlx + drag.element.w * CHAR_PX / 2 >= canvasRect.left &&
      tlx + drag.element.w * CHAR_PX / 2 <= canvasRect.right &&
      tly + drag.element.h * CHAR_PX / 2 >= canvasRect.top &&
      tly + drag.element.h * CHAR_PX / 2 <= canvasRect.bottom) {
    let col = Math.round((tlx - canvasRect.left) / CHAR_PX);
    let row = Math.round((tly - canvasRect.top) / CHAR_PX);
    col = Math.max(0, Math.min(COLS - drag.element.w, col));
    row = Math.max(0, Math.min(ROWS - drag.element.h, row));
    const collisionsWith = [];
    for (const other of ELEMENTS) {
      if (other.id === drag.element.id || !other.placed) continue;
      if (col < other.col + other.w && col + drag.element.w > other.col &&
          row < other.row + other.h && row + drag.element.h > other.row) {
        collisionsWith.push(other.id);
      }
    }
    return { kind: 'canvas', col, row, collides: collisionsWith.length > 0, collisionsWith };
  }
  if (clientX >= sidebarRect.left && clientX <= sidebarRect.right &&
      clientY >= sidebarRect.top && clientY <= sidebarRect.bottom) {
    return { kind: 'sidebar' };
  }
  return { kind: 'none' };
}

function onUp(ev) {
  if (!drag) return;
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
  const drop = computeDropTarget(ev.clientX, ev.clientY);
  if (drop.kind === 'canvas') {
    drag.element.col = drop.col;
    drag.element.row = drop.row;
    drag.element.placed = true;
  } else if (drop.kind === 'sidebar') {
    drag.element.placed = false;
  }
  drag.ghost.remove();
  drag.sourceNode.style.opacity = '1';
  drag = null;
  persist();
  renderElements();
}

// ---- Buttons ---------------------------------------------------------------

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Restaurar layout inicial (descarta cambios locales)?')) return;
  localStorage.removeItem(STORAGE_KEY);
  load();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const out = {
    _comment: 'Exported HUD layout from tools/hud_viewer.html',
    elements: ELEMENTS.map(e => ({
      id: e.id, label: e.label,
      col: e.col, row: e.row, w: e.w, h: e.h,
      placed: e.placed, fixed: !!e.fixed,
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hud_layout.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('hud_layout.json descargado', false);
});

// Hover coord readout when not dragging
document.getElementById('canvas-wrap').addEventListener('pointermove', (ev) => {
  if (drag) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const col = Math.floor((ev.clientX - rect.left) / CHAR_PX);
  const row = Math.floor((ev.clientY - rect.top) / CHAR_PX);
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
    setStatus(`Celda col ${col}, row ${row}`, false);
  }
});
document.getElementById('canvas-wrap').addEventListener('pointerleave', () => {
  if (!drag) setStatus('Listo. Arrastra elementos.', false);
});

try {
  load();
} catch (err) {
  console.error(err);
  setStatus('Error cargando layout: ' + err.message, true);
}
</script>
</body>
</html>
