<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tharkys the Knight</title>
  <!-- PWA: installed from the Android home screen, the manifest's
       display:fullscreen + orientation:landscape launch the game with NO
       browser bars from the very first frame (no gesture needed). In a normal
       tab, bars can't be hidden before a tap (browser rule) -- theme-color at
       least paints the address bar black, and the first touch auto-fullscreens
       (see script below). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- iOS fallbacks (harmless on Android): -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tharkys">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scale the canvas to the biggest 5:4 box that fits the viewport, so
     * it fills the browser window (letterboxed). !important wins over the
     * inline size Emscripten/SDL sets from the backbuffer. The backbuffer
     * itself stays large (set at window-create time in main.c) so the CRT
     * shader renders fine; the browser downscales it to this CSS size. */
    canvas#canvas {
      display: block;
      width:  min(100vw, 125vh) !important;   /* 125vh = 100vh * 5/4 */
      height: min(80vw, 100vh)  !important;    /*  80vw = 100vw * 4/5 */
      outline: none;
      background: #000;
      position: relative;                      /* sit above #touchbars */
      z-index: 2;
    }
    /* Full-screen touch control pad, ON TOP of the canvas (z-index 5, below the
     * portrait #rotate gate at 9999). It is the sole touch handler: left half =
     * floating joystick (movement), centre band = help, right half = tap/fire.
     * Invisible; touch-action:none kills scroll/double-tap-zoom gestures.
     * pointer-events is enabled only on coarse (touch) pointers, so on desktop
     * mouse clicks pass straight through to the canvas. */
    #touchpad {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
      pointer-events: none;
    }
    @media (pointer: coarse) {
      #touchpad { pointer-events: auto; }
    }
    /* Help touch finger: floats over / just-left-of the "CRT" row while the F1
     * help screen is open (toggled by window._tharkysHelp, called from main.c).
     * z-index ABOVE #touchpad so a tap on it toggles CRT instead of falling
     * through to the close-help handler. A pure DOM overlay -> free of the
     * emulator's border crop, so it can sit in the left letterbox margin. */
    .helpFingerTap {
      position: fixed; display: none; z-index: 8;
      align-items: center; justify-content: flex-start;
      touch-action: none; -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .helpFingerTap .finger {
      line-height: 1; pointer-events: none; user-select: none;
      filter: drop-shadow(0 0 4px rgba(0,0,0,.85));
      animation: fingerNudge .9s ease-in-out infinite;
    }
    @keyframes fingerNudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(30%); }
    }
    /* Debug keypad -- created by JS only when the page is opened with ?dbg=1,
     * so casual players never see it. DBG toggles the key row; each key injects
     * a ZX key via web_key() (B-U-G unlock + T/S/D/N/H/K/M + ENTER). */
    #dbgtoggle {
      position: fixed; top: 2px; left: 2px; z-index: 7;
      min-width: 34px; height: 24px;
      font: 700 11px/1 monospace; color: #0f0;
      background: rgba(0,0,0,.55); border: 1px solid #0a0; border-radius: 4px;
    }
    #dbgwrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 6;
      display: none; flex-wrap: wrap; justify-content: center;
      gap: 4px; padding: 30px 4px 6px;
      background: rgba(0,0,0,.6); touch-action: none;
    }
    #dbgwrap.open { display: flex; }
    #dbgwrap button {
      min-width: 38px; height: 38px;
      font: 700 15px/1 monospace; color: #0f0;
      background: #111; border: 1px solid #0f0; border-radius: 5px;
    }
    /* Boot-time resume button: shown only when localStorage holds a saved
     * game, hidden the moment the player resumes or reaches gameplay
     * (window._tharkysHideResume, called from main.c). z-index above
     * #touchpad so the tap lands on the button, not the control pad. */
    #resumebtn {
      position: fixed; display: none; z-index: 8;
      left: 50%; bottom: 8%; transform: translateX(-50%);
      padding: 10px 22px;
      font: 700 16px/1 monospace; color: #ffd24a; letter-spacing: 1px;
      background: rgba(0,0,0,.72); border: 2px solid #ffd24a; border-radius: 8px;
      cursor: pointer; touch-action: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 6px rgba(0,0,0,.9);
    }
    #resumebtn:active { background: rgba(255,210,74,.25); }
    /* "Rotate to landscape" gate: covers the screen on touch devices held in
     * portrait, and disappears when turned to landscape. (pointer:coarse keeps
     * it off desktop, where a tall window would otherwise trigger it.) The
     * game runs underneath; it just shouldn't be played in portrait, and it
     * keeps the tilt mapping single (always landscape). */
    #rotate { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        color: #e8e8e8;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
      #rotate .ph {
        width: 64px; height: 104px;
        border: 5px solid #e8e8e8; border-radius: 12px;
        animation: rot 1.6s ease-in-out infinite;
      }
      #rotate .t1 { font-size: 1.35rem; font-weight: 700; }
      #rotate .t2 { font-size: 1rem; color: #9aa0aa; }
      @keyframes rot {
        0%, 40%   { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="touchpad"></div>
  <div id="rotate">
    <div class="ph"></div>
    <div class="t1">Gira el dispositivo</div>
    <div class="t2">Pon el m&oacute;vil en horizontal &mdash; Rotate to landscape</div>
  </div>
  <script>
    /* Force preserveDrawingBuffer:true on the WebGL context BEFORE SDL creates
     * it. Without this, WebGL clears the back buffer after compositing each
     * frame, so canvas.toBlob() / toDataURL() return a black image -- making
     * the F2 screenshot useless. Patching getContext is the standard workaround
     * (SDL2-emscripten doesn't expose this attribute directly). Tiny perf cost
     * (one extra copy per swap); negligible for a 50 Hz Spectrum game. */
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
        }
        return orig.call(this, type, attrs);
      };
    })();

    /* Screenshot the canvas as a PNG download. "What you see" capture: includes
     * the CRT shader, overlays, HUD -- whatever is on screen at that moment.
     * Resolution = canvas backbuffer (CSS size x devicePixelRatio with HIGHDPI),
     * so HiDPI screens get a high-res PNG that itch.io can use straight. Bound
     * to F2 (desktop) and to the camera button on the debug panel (mobile). */
    function takeScreenshot() {
      var c = document.getElementById('canvas');
      if (!c || !c.toBlob) return;
      c.toBlob(function (blob) {
        if (!blob) { console.error('screenshot: empty blob'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tharkys_' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }, 'image/png');
    }

    /* ---- Save / resume (localStorage). The emulator state is a standard
     * 128K .sna + a 14-byte AY sidecar, produced/consumed by the exported
     * web_save_state / web_load_state (see main.c). We base64 it into
     * localStorage (~175 KB, well under every browser's quota) so a save
     * survives page reloads and Pages auto-updates -- the snapshot embeds
     * the game code it was taken from, so it stays self-consistent even if
     * the deployed build moves on. Reachable from: F7/F8 (desktop browser),
     * the SAVE/LOAD rows of the F1 help (touch fingers, mobile), and the
     * boot-time resume button below. */
    var SAVE_KEY = 'tharkys_save_v1';
    var SAVE_META_KEY = 'tharkys_save_meta';

    function u8ToB64(u8) {
      var s = '';
      for (var i = 0; i < u8.length; i += 32768) {
        s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
      }
      return btoa(s);
    }
    function b64ToU8(b) {
      var s = atob(b), u = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    }
    function hasSave() {
      try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
    }
    /* This build is NOT modularized: emscripten's heap view and the libc
     * allocator live as page-scope globals (HEAPU8 / _malloc / _free), not
     * as Module properties. Resolve both spellings so a future switch to
     * -sMODULARIZE keeps working. */
    function emHeap()   { return (typeof HEAPU8 !== 'undefined') ? HEAPU8 : Module.HEAPU8; }
    function emMalloc(n){ return (typeof _malloc === 'function') ? _malloc(n) : Module._malloc(n); }
    function emFree(p)  { (typeof _free === 'function') ? _free(p) : Module._free(p); }
    window.tharkysSave = function () {
      if (typeof Module === 'undefined' || !Module._web_save_state) return;
      var p = Module._web_save_state();          /* 0 = not possible right now */
      if (!p) return;
      var n = Module._web_save_size();
      /* The OSD toast is confirmed HERE, after setItem actually lands --
       * quota errors / private-browsing modes throw, and the player must
       * not be told "GAME SAVED" when nothing persisted. */
      try {
        localStorage.setItem(SAVE_KEY, u8ToB64(emHeap().subarray(p, p + n)));
        localStorage.setItem(SAVE_META_KEY, JSON.stringify(
          { t: Date.now(), v: window.__BUILD_V || 'dev' }));
        if (Module._web_save_ok) Module._web_save_ok();
      } catch (e) {
        console.error('tharkys: save failed', e);
        if (Module._web_save_fail) Module._web_save_fail();
      }
    };
    /* Corrupted / stale save: toast, clear the bad entry (retrying would
     * fail identically forever) and drop the resume button. */
    function badSave() {
      try {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(SAVE_META_KEY);
      } catch (e) {}
      if (typeof Module !== 'undefined' && Module._web_bad_save) Module._web_bad_save();
      if (window._tharkysHideResume) window._tharkysHideResume();
    }
    window.tharkysLoad = function () {
      if (typeof Module === 'undefined' || !Module._web_load_state) return;
      var b = null;
      try { b = localStorage.getItem(SAVE_KEY); } catch (e) {}
      if (!b) {
        if (Module._web_no_save) Module._web_no_save();
        return;
      }
      var u8;
      try { u8 = b64ToU8(b); }                   /* atob throws on tampering */
      catch (e) { badSave(); return; }
      var p = emMalloc(u8.length);
      if (!p) { console.error('tharkys: malloc failed'); return; }
      emHeap().set(u8, p);
      var ok = Module._web_load_state(p, u8.length);  /* 1 = parked for restore */
      emFree(p);
      if (ok) {
        if (window._tharkysHideResume) window._tharkysHideResume();
      } else {
        badSave();          /* wrong size: truncated or from another format */
      }
    };

    /* Boot-time resume button (only if a save exists). Clicking it doubles
     * as the press-any-key gesture: the window-level first-gesture listeners
     * resume the AudioContext, and web_load_state dismisses the intro. */
    (function () {
      if (!hasSave()) return;
      var btn = document.createElement('button');
      btn.id = 'resumebtn';
      btn.textContent = '▶ CONTINUAR · RESUME';
      function hit(e) {
        if (e && e.cancelable) e.preventDefault();
        window.tharkysLoad();
      }
      btn.addEventListener('touchstart', hit, { passive: false });
      btn.addEventListener('click', hit);
      document.body.appendChild(btn);
      btn.style.display = 'block';
      window._tharkysHideResume = function () {
        btn.style.display = 'none';
      };
    })();

    var Module = {
      canvas: document.getElementById('canvas'),
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      /* Cache-busting: append the build version (?v=<hash>) the deploy
       * injects into window.__BUILD_V to every asset emscripten loads
       * (notably tharkys.wasm). The version is the wasm content hash, so
       * it changes whenever the build changes and the browser fetches the
       * new file instead of reusing the cached same-named one. No-op
       * locally (window.__BUILD_V undefined). */
      locateFile: function (path, prefix) {
        return prefix + path + (window.__BUILD_V ? ('?v=' + window.__BUILD_V) : '');
      }
    };

    /* SDL captures keys at window scope and preventDefaults every keydown,
     * which would kill the browser's own shortcuts. A capture-phase filter
     * (registered before the wasm loads) lets reload / DevTools / fullscreen
     * keys through: stopImmediatePropagation keeps SDL from seeing them, and
     * by NOT calling preventDefault the browser handles them normally. */
    window.addEventListener('keydown', function (e) {
      var k = e.key;
      var mod = e.ctrlKey || e.metaKey;
      var pass =
        k === 'F5' || k === 'F11' || k === 'F12' ||
        (mod && (k === 'r' || k === 'R')) ||
        (mod && e.shiftKey && (k === 'R' || k === 'r' ||
                               k === 'I' || k === 'i' ||
                               k === 'J' || k === 'j' ||
                               k === 'C' || k === 'c'));
      if (pass) e.stopImmediatePropagation();
      /* F2: toggle the CRT shader, matching the desktop build's F2. We own it
       * here (swallow before SDL) and call the exported hook directly -- the
       * reliable route in the browser, where relying on SDL seeing the F-key is
       * iffy. The native build's own SDLK_F2 handler in main.c is unaffected. */
      if (k === 'F2') {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (typeof Module !== 'undefined' && Module._web_toggle_crt) Module._web_toggle_crt();
      }
      /* F3: cycle the border crop, matching the desktop build's F3. Same deal
       * as F2 -- the browser's default (F3 = "find next") would otherwise eat
       * it, so we swallow it and call the exported hook directly. */
      if (k === 'F3') {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (typeof Module !== 'undefined' && Module._web_cycle_border) Module._web_cycle_border();
      }
      /* F4: screenshot of the current frame (moved off F2, which now toggles
       * CRT). Also available on the mobile debug panel's camera button. The
       * browser has no default for F4, so we just swallow and capture. */
      if (k === 'F4') {
        e.stopImmediatePropagation();
        e.preventDefault();
        takeScreenshot();
      }
      /* F6: step one frame. Chrome's default is "focus the address bar" -- we
       * preventDefault to block that, but DO let SDL see the key (no
       * stopImmediatePropagation) so the in-game handler in main.c queues a
       * step and auto-pauses. */
      if (k === 'F6') {
        e.preventDefault();
      }
      /* F7/F8: save / load state. Swallowed before SDL (F7 is caret browsing
       * in Firefox; and main.c's own F7/F8 handlers are desktop-only) and
       * routed through the localStorage helpers above. e.repeat guard:
       * holding the key would re-serialize ~175 KB per auto-repeat. */
      if (k === 'F7') {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat) window.tharkysSave();
      }
      if (k === 'F8') {
        e.stopImmediatePropagation();
        e.preventDefault();
        if (!e.repeat) window.tharkysLoad();
      }
    }, true);

    /* Browser autoplay policy starts every AudioContext suspended until a
     * user gesture. Patch the constructor to track instances SDL creates,
     * then resume them all on the first gesture (incl. the first keypress)
     * so audio comes up without a separate click. */
    (function () {
      var contexts = [];
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (Orig) {
        var Tracked = function () {
          var c = Reflect.construct(Orig, arguments);
          contexts.push(c);
          return c;
        };
        Tracked.prototype = Orig.prototype;
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
      }
      function resumeAll() {
        for (var i = 0; i < contexts.length; i++) {
          try { if (contexts[i].state === 'suspended') contexts[i].resume(); }
          catch (e) {}
        }
      }
      ['keydown', 'pointerdown', 'mousedown', 'touchstart'].forEach(function (t) {
        window.addEventListener(t, resumeAll, { passive: true });
      });
    })();
    /* Backbuffer resolution is handled by SDL_WINDOW_ALLOW_HIGHDPI in
     * main.c (CSS size x devicePixelRatio), so no JS canvas sizing here --
     * the CSS above just controls the responsive visual size. */

    /* ---- Mobile controls: tilt (4 dir) via DeviceOrientation, pushed to C as
     * web_set_tilt(up,down,left,right). PARKED: movement is now the touch
     * joystick (see the control pad below), which feeds the SAME web_set_tilt
     * input, so tilt and the stick would fight. The whole tilt path is kept
     * intact but disabled behind USE_TILT -- set it to true to revive the
     * gyroscope (e.g. as a selectable mode later). When live it is inert on
     * desktop (deviceorientation never fires there).
     *
     * ORIENTATION COMPENSATION (kept for when tilt is revived): DeviceOrientation
     * reports beta/gamma in the device's NATIVE (portrait) frame, which does NOT
     * rotate with the screen. The game runs in LANDSCAPE, so a raw gamma->L/R,
     * beta->U/D map is rotated 90 degrees. We rotate the (gamma, beta) vector by
     * screen.orientation.angle into screen space (sx=right+, sy=down+).
     * Derived rotation (Gx~=gamma along device-right, Gy~=-beta):
     *   angle 0:   sx= dg, sy= db     angle 180: sx=-dg, sy=-db
     *   angle 90:  sx= db, sy=-dg     angle 270: sx=-db, sy= dg     */
    var USE_TILT = false;   /* gyroscope parked; set true to revive */
    (function () {
      if (!USE_TILT) return;
      var up = 0, down = 0, left = 0, right = 0;
      var beta0 = null, gamma0 = null;   /* neutral, captured on first reading */
      var ang0  = null;                  /* screen angle when neutral captured  */
      var THRESH = 10;                    /* degrees past neutral to engage      */
      var DBG = /[?&]tiltdebug=1/.test(location.search);
      var dbgEl = null;

      function send() {
        if (typeof Module !== 'undefined' && Module._web_set_tilt) {
          Module._web_set_tilt(up, down, left, right);
        }
      }

      function screenAngle() {
        var a = (window.screen && screen.orientation &&
                 typeof screen.orientation.angle === 'number')
                  ? screen.orientation.angle
                  : (typeof window.orientation === 'number' ? window.orientation : 0);
        return ((a % 360) + 360) % 360;   /* normalize, maps -90 -> 270 */
      }

      function onOrient(e) {
        if (e.gamma === null || e.beta === null) return;
        var ang = screenAngle();
        /* (Re)capture neutral on first reading or whenever the screen flips
         * (e.g. landscape 90 <-> 270), so the deltas stay relative to how the
         * phone is currently held. */
        if (beta0 === null || ang !== ang0) {
          beta0 = e.beta; gamma0 = e.gamma; ang0 = ang;
          up = down = left = right = 0; send();
          return;
        }
        var dg = e.gamma - gamma0;   /* device-frame: + = right edge down */
        var db = e.beta  - beta0;    /* device-frame: + = top toward you   */
        var sx, sy;                  /* screen-frame: sx right+, sy down+  */
        switch (ang) {
          case 90:  sx =  db; sy = -dg; break;
          case 180: sx = -dg; sy = -db; break;
          case 270: sx = -db; sy =  dg; break;
          default:  sx =  dg; sy =  db; break;   /* 0 (portrait-native) */
        }
        left  = sx < -THRESH ? 1 : 0;
        right = sx >  THRESH ? 1 : 0;
        up    = sy >  THRESH ? 1 : 0;   /* Y inverted: device sign felt reversed */
        down  = sy < -THRESH ? 1 : 0;
        send();
        if (DBG) {
          if (!dbgEl) {
            dbgEl = document.createElement('div');
            dbgEl.style.cssText = 'position:fixed;left:0;top:0;z-index:10000;' +
              'font:12px/1.4 monospace;color:#0f0;background:rgba(0,0,0,.7);' +
              'padding:4px 6px;white-space:pre;pointer-events:none';
            document.body.appendChild(dbgEl);
          }
          dbgEl.textContent =
            'ang=' + ang + '  b=' + e.beta.toFixed(0) + ' g=' + e.gamma.toFixed(0) +
            '\ndg=' + dg.toFixed(0) + ' db=' + db.toFixed(0) +
            '  sx=' + sx.toFixed(0) + ' sy=' + sy.toFixed(0) +
            '\n' + (up?'U':'-') + (down?'D':'-') + (left?'L':'-') + (right?'R':'-');
        }
      }
      function enableTilt() {
        window.addEventListener('deviceorientation', onOrient);
      }
      /* iOS 13+ needs permission, requested from inside a user gesture.
       * Android / others just start listening. */
      function requestTilt() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(function (s) { if (s === 'granted') enableTilt(); })
            .catch(function () {});
        } else {
          enableTilt();
        }
      }
      window.addEventListener('touchstart', requestTilt, { once: true });
    })();

    /* Auto-fullscreen in landscape (Android) to hide the browser's URL/nav bars.
     * Fullscreen needs a user gesture, so the FIRST touch triggers it -- and the
     * player must tap once anyway (to dismiss the press-a-key intro), so no
     * install is needed for a barless experience. RE-ENTRANT: we keep the
     * listener and re-enter on any later landscape touch when not already
     * fullscreen (goFs no-ops if it is), so an accidental exit / rotate / app-
     * switch is recovered on the next tap instead of stranding the player with
     * bars. iOS ignores requestFullscreen on non-video elements (use "Add to
     * Home Screen" for a barless PWA there). */
    (function () {
      function goFs() {
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        if (!window.matchMedia('(orientation: landscape)').matches) return;
        var el = document.documentElement;
        var r = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        if (r) { try { r.call(el); } catch (e) {} }
      }
      window.addEventListener('touchstart', goFs, { passive: true });
      window.addEventListener('orientationchange', function () { setTimeout(goFs, 300); });
    })();

    /* ---- Touch control pad (mobile). #touchpad covers the screen on top of the
     * canvas and is the sole touch handler:
     *   LEFT half   = floating joystick. The first touch point is the neutral
     *                 centre; dragging past a deadzone sets up/down/left/right
     *                 (diagonals when both axes pass it), pushed via
     *                 web_set_tilt(). Released -> all directions cleared.
     *   CENTRE band = web_touch(CENTER) -> help (toggle) in gameplay.
     *   RIGHT half  = web_touch(RIGHT)  -> fire (tap).
     * Multi-touch by identifier, so the left thumb can steer while the right
     * thumb taps fire. preventDefault kills browser gestures but lets the event
     * bubble, so the window-level audio/fullscreen first-touch handlers still
     * run. web_touch also dismisses the intro and advances wrapper overlays. */
    (function () {
      var pad = document.getElementById('touchpad');
      if (!pad) return;
      var ZONE_L = 0, ZONE_C = 1, ZONE_R = 2;
      var CENTER_LO = 0.40, CENTER_HI = 0.60;   /* central help band, frac of width */
      var DEAD = 14;                             /* joystick deadzone (px)           */
      var joyId = null, ox = 0, oy = 0;          /* active left-zone touch + origin  */

      function M(fn, a) {
        if (typeof Module !== 'undefined' && Module[fn]) Module[fn].apply(Module, a || []);
      }
      function zoneOf(x) {
        var f = x / (window.innerWidth || 1);
        return f < CENTER_LO ? ZONE_L : (f < CENTER_HI ? ZONE_C : ZONE_R);
      }
      function setDir(u, d, l, r) { M('_web_set_tilt', [u, d, l, r]); }
      function updateJoy(t) {
        var dx = t.clientX - ox, dy = t.clientY - oy;
        setDir(dy < -DEAD ? 1 : 0, dy > DEAD ? 1 : 0,
               dx < -DEAD ? 1 : 0, dx > DEAD ? 1 : 0);
      }

      pad.addEventListener('touchstart', function (e) {
        if (e.cancelable) e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i], z = zoneOf(t.clientX);
          if (z === ZONE_L && joyId === null) {
            joyId = t.identifier; ox = t.clientX; oy = t.clientY;
          }
          M('_web_touch', [z]);   /* arms/advances/intro; fire or help by zone */
        }
      }, { passive: false });

      pad.addEventListener('touchmove', function (e) {
        if (e.cancelable) e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier === joyId) updateJoy(t);
        }
      }, { passive: false });

      function endTouch(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyId) {
            joyId = null; setDir(0, 0, 0, 0);
          }
        }
      }
      pad.addEventListener('touchend', endTouch, { passive: false });
      pad.addEventListener('touchcancel', endTouch, { passive: false });
    })();

    /* ---- Help touch overlay. While the F1 help screen is up, main.c calls
     * window._tharkysHelp(1) (and (0) on close). We float a finger 👉 just left
     * of each tappable row, pointing at it: the "CRT" row toggles the CRT shader
     * (web_toggle_crt) and "BORDER" cycles the border crop (web_cycle_border) --
     * the desktop F2/F3 keys are unreachable in the browser. Pure DOM, so the
     * emulator's border crop doesn't constrain it (the finger can live in the
     * left letterbox margin). On-screen row positions are derived from the
     * canvas rect + the current border zoom (web_get_zoom), inverting the
     * shader's symmetric inset, so each finger tracks its row exactly. */
    (function () {
      var VIS_W = 320, VIS_H = 256, BORDER = 32, CHAR = 8;
      /* Tappable rows = line index in HELP_TEXT -> wrapper action. CRT = row 9
       * ("CRT  F2"), BORDER = row 11 ("BORDER F3"), SAVE = row 13 ("SAVE F7"),
       * LOAD = row 15 ("LOAD F8"). `fn` is an exported Module hook; `run` is
       * a local JS helper (save/load own localStorage on the JS side).
       * 'reflow' rows change the zoom, so tapping them re-places every
       * finger. */
      var ITEMS = [
        { row: 9,  fn: '_web_toggle_crt',   reflow: false },
        { row: 11, fn: '_web_cycle_border', reflow: true  },
        { row: 13, run: function () { window.tharkysSave(); }, reflow: false },
        { row: 15, run: function () { window.tharkysLoad(); }, reflow: false }
      ];
      var els = null, shown = false;

      function M(fn) { return (typeof Module !== 'undefined') ? Module[fn] : null; }
      function zoom() { var f = M('_web_get_zoom'); return f ? f() : 0.095; } /* def = BORDER_MIN */
      /* shader: tex = (screen - 0.5)*(1 - 2z) + 0.5  ->  invert for screen pos */
      function texToScreen(f, z) { return (f - 0.5) / (1 - 2 * z) + 0.5; }

      function build() {
        els = ITEMS.map(function (it) {
          var tap = document.createElement('div');
          tap.className = 'helpFingerTap';
          var f = document.createElement('span');
          f.className = 'finger'; f.textContent = '👉';   /* 👉 */
          tap.appendChild(f);
          function hit(e) {
            if (e && e.cancelable) e.preventDefault();
            if (e) e.stopPropagation();
            if (it.run) { it.run(); }
            else { var fn = M(it.fn); if (fn) fn(); }
            if (it.reflow) placeAll();   /* border cycle moved every row */
          }
          tap.addEventListener('touchstart', hit, { passive: false });
          tap.addEventListener('click', hit);
          document.body.appendChild(tap);
          return tap;
        });
      }

      function placeAll() {
        var c = document.getElementById('canvas');
        if (!els || !c) return;
        var r = c.getBoundingClientRect();
        var z = zoom();
        var rowPx = (CHAR / VIS_H) * r.height / (1 - 2 * z);   /* one char row on screen */
        /* tapH < 2*rowPx so the CRT (row 9) and BORDER (row 11) targets, two
         * rows apart, never overlap. */
        var fingerW = rowPx * 1.3, gap = rowPx * 0.25, tapH = rowPx * 1.6;
        ITEMS.forEach(function (it, i) {
          var tap = els[i];
          var cy = r.top  + texToScreen((BORDER + it.row * CHAR + CHAR / 2) / VIS_H, z) * r.height;
          var tx = r.left + texToScreen(BORDER / VIS_W, z) * r.width;            /* col 0 */
          var ex = r.left + texToScreen((BORDER + 9 * CHAR) / VIS_W, z) * r.width; /* end of hint */
          var left = Math.max(2, tx - fingerW - gap);
          tap.style.left     = left + 'px';
          tap.style.top      = (cy - tapH / 2) + 'px';
          tap.style.width    = Math.max(fingerW, ex - left) + 'px';
          tap.style.height   = tapH + 'px';
          tap.style.fontSize = fingerW + 'px';
        });
      }

      /* Touch affordance only: show the fingers on coarse-pointer (touch)
       * devices. On desktop the player uses F2/F3, so they'd be clutter. */
      function isTouch() {
        return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      }
      window._tharkysHelp = function (open) {
        if (open) {
          if (!isTouch()) return;
          if (!els) build();
          shown = true; placeAll();
          els.forEach(function (e) { e.style.display = 'flex'; });
        } else {
          shown = false;
          if (els) els.forEach(function (e) { e.style.display = 'none'; });
        }
      };
      window.addEventListener('resize', function () { if (shown) placeAll(); });
      window.addEventListener('orientationchange',
        function () { setTimeout(function () { if (shown) placeAll(); }, 350); });
    })();

    /* ---- Debug keypad. Built only when opened with ?dbg=1 so casual players
     * never see it. A "DBG" toggle shows a row of keys that inject ZX keys via
     * web_key(): the B-U-G unlock sequence, the debug keys it enables
     * (T day cycle, S/D nasty speed, N noclip, H skip milestone, K cycle key,
     * M minimap) and ENTER (pause). Codes are lowercase ASCII; ENTER = 0x0D. */
    (function () {
      if (!/[?&](dbg|debug)=1/.test(location.search)) return;
      var KEYS = [
        ['B', 98], ['U', 117], ['G', 103], null,
        ['T', 116], ['S', 115], ['D', 100], ['N', 110],
        ['H', 104], ['K', 107], ['M', 109], null,
        ['⏎', 13]
        /* The screenshot button is appended after this loop -- it doesn't
         * inject a ZX key, so it doesn't fit the [label, code] schema. */
      ];
      var wrap = document.createElement('div');
      wrap.id = 'dbgwrap';
      KEYS.forEach(function (k) {
        if (!k) { var sp = document.createElement('span'); sp.style.width = '12px'; wrap.appendChild(sp); return; }
        var b = document.createElement('button');
        b.textContent = k[0];
        function hit(e) {
          if (e.cancelable) e.preventDefault();   /* suppress the synthetic click on touch */
          if (typeof Module !== 'undefined' && Module._web_key) Module._web_key(k[1]);
        }
        b.addEventListener('touchstart', hit, { passive: false });
        b.addEventListener('click', hit);   /* desktop / mouse */
        wrap.appendChild(b);
      });

      /* Screenshot button (PNG of the current frame, same as desktop F2). */
      var shot = document.createElement('button');
      shot.textContent = '📷';   /* camera emoji */
      shot.title = 'Screenshot (PNG)';
      function shotHit(e) {
        if (e && e.cancelable) e.preventDefault();
        takeScreenshot();
      }
      shot.addEventListener('touchstart', shotHit, { passive: false });
      shot.addEventListener('click', shotHit);
      wrap.appendChild(shot);

      /* CRT + BORDER toggles. These are WRAPPER actions (not ZX keys), so they
       * call the exported main.c hooks directly instead of web_key(): the
       * desktop F2/F3 keys are unreachable in the browser (F2 = screenshot,
       * F3 = browser "find", no keyboard on mobile). Lets us confirm both
       * effects are live in the web build and is the same hook the help touch
       * overlay will use. */
      function mkWrapBtn(label, title, fn) {
        var b = document.createElement('button');
        b.textContent = label; b.title = title;
        function hit(e) {
          if (e && e.cancelable) e.preventDefault();
          if (typeof Module !== 'undefined' && Module[fn]) Module[fn]();
        }
        b.addEventListener('touchstart', hit, { passive: false });
        b.addEventListener('click', hit);
        wrap.appendChild(b);
      }
      mkWrapBtn('CRT', 'Toggle CRT shader (desktop F2)', '_web_toggle_crt');
      mkWrapBtn('BRD', 'Cycle border crop (desktop F3)', '_web_cycle_border');
      document.body.appendChild(wrap);

      var tgl = document.createElement('button');
      tgl.id = 'dbgtoggle';
      tgl.textContent = 'DBG';
      function toggle(e) {
        if (e && e.cancelable) e.preventDefault();
        wrap.classList.toggle('open');
      }
      tgl.addEventListener('touchstart', toggle, { passive: false });
      tgl.addEventListener('click', toggle);
      document.body.appendChild(tgl);
    })();
  </script>
